# Single trusted backend; auth_enabled is tenant separation, not authentication.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    # Preserve the existing schema epoch/prefix so retained indexes remain readable.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    # Match the previous bootstrap's defaults; do not orphan unshipped indexes.
    active_index_directory: /loki/tsdb-shipper-active
    cache_location: /loki/tsdb-shipper-cache
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem
limits_config:
  retention_period: 720h
  max_query_lookback: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  allow_structured_metadata: true
  # Never infer stream labels/levels from unknown application attributes.
  discover_service_name: []
  discover_log_levels: false
  # Native push excludes service_name from this budget; this is not an allowlist.
  max_label_names_per_series: 1
  max_label_name_length: 32
  max_label_value_length: 64
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
        - action: drop
          regex: '.*'
    scope_attributes:
      - action: drop
        regex: '.*'
    log_attributes:
      - action: drop
        regex: '.*'
analytics:
  reporting_enabled: false
