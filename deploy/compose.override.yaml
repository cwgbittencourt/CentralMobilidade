# Development only. Load explicitly alongside compose.yaml; base-only commands stay unchanged.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  influxdb-queryable:
    ports:
      - "127.0.0.1:${INFLUXDB_QUERYABLE_PORT:-8181}:8181"

  influxdb-pending:
    # Administrative debugging only; authentication and the separate pending network remain enabled.
    ports:
      - "127.0.0.1:${INFLUXDB_PENDING_PORT:-8182}:8181"

  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  api:
    profiles: [app]
    image: centralmobilidade-api:dev
    build:
      context: ..
      dockerfile: deploy/containers/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks: [backend]
    volumes:
      - quarantine_data:/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      quarantine-init:
        condition: service_completed_successfully

  worker:
    profiles: [app]
    image: centralmobilidade-worker:dev
    build:
      context: ..
      dockerfile: deploy/containers/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
    networks: [backend, pending]
    volumes:
      - quarantine_data:/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb-queryable-init:
        condition: service_completed_successfully
      influxdb-pending-init:
        condition: service_completed_successfully
      quarantine-init:
        condition: service_completed_successfully
    # The current worker skeleton exits successfully; its hosted service follows in T053.
    restart: "no"

  pubsub-emulator:
    profiles: [pubsub-emulator]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-emulators
    command: [gcloud, beta, emulators, pubsub, start, "--host-port=0.0.0.0:8085", "--project=${PUBSUB_PROJECT_ID:-centralmobilidade-local}", --quiet]
    ports:
      - "127.0.0.1:${PUBSUB_EMULATOR_PORT:-8085}:8085"
    networks: [backend]
    # No persistent volume: emulator state is valid only for its current session.
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 8085), timeout=2).close()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
