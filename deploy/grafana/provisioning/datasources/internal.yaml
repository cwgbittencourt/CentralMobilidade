apiVersion: 1
datasources:
  - name: Internal InfluxDB
    uid: internal-influx
    orgId: 1
    type: influxdb
    access: proxy
    url: http://influxdb:8181
    isDefault: true
    editable: false
    jsonData:
      version: SQL
      dbName: telemetry
      insecureGrpc: true
    secureJsonData:
      token: $INFLUXDB_GRAFANA_READ_TOKEN
  - name: Internal Prometheus
    uid: internal-prometheus
    orgId: 1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Internal Loki
    uid: internal-loki
    orgId: 1
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
