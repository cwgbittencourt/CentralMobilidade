# Grafana 12.2.5. Internal rule state only; all notifications are muted 24/7.
# Existing contact points and the root notification policy are not replaced.
apiVersion: 1
muteTimes:
  - orgId: 1
    name: telemetry-local-only
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
groups:
  - orgId: 1
    name: telemetry-local
    folder: Platform Operations
    interval: 30s
    rules:
      - uid: telemetry-backlog-age
        title: 'Backlog — idade observada elevada'
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: 'histogram_quantile(0.95, sum by(le) (rate(telemetry_queue_delivery_age_seconds_bucket{job="worker"}[5m])))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A > 120'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Backlog — idade observada elevada'
          description: 'Idade p95 entregue acima de dois minutos; não mede a mensagem mais antiga ainda na fila. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '6'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: warning
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
      - uid: telemetry-queryability-risk
        title: 'Risco de consulta em cinco minutos'
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: '(histogram_quantile(0.95, sum by(le) (rate(telemetry_queue_delivery_age_seconds_bucket{job="worker"}[5m])))) + (histogram_quantile(0.95, sum by(le) (rate(telemetry_processing_duration_seconds_bucket{job="worker"}[5m]))))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A > 180'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Risco de consulta em cinco minutos'
          description: 'Soma de estimativas p95 acima de três minutos; não é p95 conjunto nem medição do SLO. A tentativa já inclui escrita. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '7'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: warning
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
      - uid: telemetry-retention-risk
        title: 'Retenção — entregas acima de seis dias'
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: 'clamp_min(sum(increase(telemetry_queue_delivery_age_seconds_count{job="worker"}[5m])) - sum(increase(telemetry_queue_delivery_age_seconds_bucket{job="worker",le=~"518400([.]0)?"}[5m])), 0)'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A > 0.5'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Retenção — entregas acima de seis dias'
          description: 'Entregas observadas acima de seis dias. Bucket exato; não inspeciona backlog parado, TTL restante ou retenção gerenciada. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '6'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: critical
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
      - uid: telemetry-storage-failure
        title: 'Armazenamento — falhas de chamadas'
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: 'sum(increase(telemetry_storage_write_failures_total{job=~"api|worker"}[5m]))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A > 0.5'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Armazenamento — falhas de chamadas'
          description: 'Falhas lançadas pelo writer, exceto cancelamento do chamador. Inclui chamadas inválidas; rejeições por linha são sinal separado no dashboard. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '12'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: critical
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
      - uid: telemetry-disk-pressure
        title: 'Disco — espaço disponível abaixo de 10%'
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: 'min(node_filesystem_avail_bytes{job="host"} / node_filesystem_size_bytes{job="host"})'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A < 0.1'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Disco — espaço disponível abaixo de 10%'
          description: 'Requer exporter e mounts aprovados. No Docker Desktop mede a VM Linux, não NTFS nem consumo por volume. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '16'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: critical
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
      - uid: telemetry-worker-silence
        title: 'Worker — consumer sem heartbeat ou scrape indisponível'
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            datasourceUid: internal-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: internal-prometheus}
              expr: 'max(telemetry_worker_heartbeat_age_seconds{job="worker"}) + (1 - min(up{job="worker"})) * 1000000000'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              datasource: {type: __expr__, uid: __expr__}
              expression: '$A > 30'
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: 'Worker — consumer sem heartbeat ou scrape indisponível'
          description: 'Heartbeat monotônico da assinatura ativa, não tráfego HTTP. Inicialização/indisponibilidade exportam +Inf; ausência de serviço também exige verificação. Sem dados ou erro de avaliação também exigem investigação; não equivalem a zero saudável.'
          __dashboardUid__: platform-operations
          __panelId__: '2'
          runbook: 'deploy/grafana/provisioning/alerting/README.md'
        labels:
          service: telemetry
          scope: local-only
          severity: critical
        notification_settings:
          receiver: grafana-default-email
          mute_time_intervals: [telemetry-local-only]
          group_by: [grafana_folder, alertname]
